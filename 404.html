<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SonicWave</title>
    <script type="text/javascript">
      // SPA fallback for GitHub Pages (pattern from rafgraph/spa-github-pages).
      // GitHub Pages serves this file for unknown paths; re-enter index.html with
      // the path encoded in the query string so client-side routing can take over.
      // pathSegmentsToKeep = 1 → the repo name ("/sonicwave/").
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
